name: Build cuda:12.8.1-cudnn-devel-rockylinux9

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docker/cuda/12.8.1-cudnn-devel-rockylinux9/**'
      - '.github/workflows/cuda-12.8.1-cudnn-devel-rockylinux9.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cuda
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=12.8.1-cudnn-devel-rockylinux9
            type=sha,prefix=12.8.1-cudnn-devel-rockylinux9-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/cuda/12.8.1-cudnn-devel-rockylinux9
          file: ./docker/cuda/12.8.1-cudnn-devel-rockylinux9/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
